<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-labelledby="title desc">
<title id="title">Original automotive mechanic character concept</title>
<desc id="desc">An original hooded mechanic in reinforced coveralls holding a diagnostic scanner and a ratchet, surrounded by restrained gold energy and cyan diagnostic signals. The design uses no existing franchise character or costume.</desc>
<defs>
  <linearGradient id="aura" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2bc58" stop-opacity=".68"/><stop offset="1" stop-color="#e2bc58" stop-opacity="0"/></linearGradient>
  <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34414b"/><stop offset=".55" stop-color="#18232d"/><stop offset="1" stop-color="#0b0d12"/></linearGradient>
  <linearGradient id="mask" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#68737b"/><stop offset="1" stop-color="#202a33"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#86ffff"/><stop offset="1" stop-color="#168f9a"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
