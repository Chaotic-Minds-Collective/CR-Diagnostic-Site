name: Application quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Check for server-side Supabase secrets in frontend source
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'service_role|sb_secret_[A-Za-z0-9_-]+' src index.html; then
            echo "Possible server-side Supabase credential found in frontend source."
            exit 1
          fi
          echo "No known service-role/secret-key patterns found in frontend source."
