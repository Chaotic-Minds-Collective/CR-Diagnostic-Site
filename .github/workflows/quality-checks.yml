name: Application quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate npm lockfile for review
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Check for server-side Supabase secrets in frontend source
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'service_role|sb_secret_[A-Za-z0-9_-]+' src index.html; then
            echo "Possible server-side Supabase credential found in frontend source."
            exit 1
          fi
          echo "No known service-role/secret-key patterns found in frontend source."
